# ─────────────────────────────────────────────────────────────────────────────
# application.properties  –  Spring Boot User Service
#
# All sensitive values are injected via environment variables.
# Never hard-code credentials here; never commit a .env file to version control.
#
# Local dev:  export DB_HOST=localhost DB_NAME=registration DB_USER=root DB_PASS=secret
# AWS / ECS:  set these as Task Definition environment variables or Secrets Manager refs
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=user-service
server.port=8080

# ── AWS RDS MySQL connection ──────────────────────────────────────────────────
# DB_HOST  : RDS endpoint, e.g. mydb.abc123.us-east-1.rds.amazonaws.com
# DB_PORT  : default 3306
# DB_NAME  : database / schema name
# DB_USER  : master username or IAM DB auth user
# DB_PASS  : master password (use AWS Secrets Manager in production)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:registration}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP defaults are sane; tweak for your RDS instance size)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Use 'validate' in production; 'update' is fine for dev/staging
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── CORS ─────────────────────────────────────────────────────────────────────
# Restrict to your actual frontend origin in production
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
